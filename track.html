<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Distance Tracker</title>
<style>
  :root {
    --bg: #10151b;
    --panel: #182129;
    --line: #2a3540;
    --text: #e8edf2;
    --muted: #8a99a6;
    --accent: #3ba3ff;
    --good: #35c78a;
    --bad: #ff5d5d;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  header h1 { font-size: 16px; margin: 0; }
  .distance-pill {
    background: #0e1419;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .distance-pill strong { color: var(--accent); font-size: 15px; }
  #map { flex: 1; width: 100%; }
  .legend {
    position: absolute;
    bottom: 20px;
    left: 20px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
    z-index: 5;
  }
  .legend-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
  }
  .avatar {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    object-fit: cover;
    flex: none;
    border: 1px solid var(--line);
  }
  .swatch {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex: none;
  }
  .wrap { position: relative; flex: 1; display: flex; }
  .info-card {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 2px;
  }
  .info-card img {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    object-fit: cover;
  }
  .info-card .name { font-weight: 600; font-size: 14px; }
  .info-card .time { font-size: 12px; color: #666; }
</style>
</head>
<body>

<header>
  <h1>Live Location Tracker</h1>
  <div class="distance-pill">
    Distance: <strong id="distanceVal">—</strong>
  </div>
</header>

<div class="wrap">
  <div id="map"></div>
  <div class="legend" id="legend"></div>
</div>

<script>
  // ---- CONFIGURE THESE ----
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwHLc5b6ha6Fx1R5iWwhvwhl3QrKbOtwgINCG721uwBjzyl_8PQ0bhZcPuQ-q7NDcw_/exec";
  const SECRET = "my-team-2026"; // must match Code.gs
  const POLL_MS = 5000;
  // --------------------------

  const COLORS = ["#3ba3ff", "#ff9f43", "#35c78a", "#ff5d5d", "#c78aff"];

  let map;
  let markers = {}; // name -> google.maps.Marker
  let infoWindow;
  let line;

  function initMap() {
    map = new google.maps.Map(document.getElementById("map"), {
      zoom: 13,
      center: { lat: 0, lng: 0 },
      styles: darkMapStyle
    });

    infoWindow = new google.maps.InfoWindow();
    line = new google.maps.Polyline({
      map,
      strokeColor: "#8a99a6",
      strokeOpacity: 0.7,
      strokeWeight: 2
    });

    poll();
    setInterval(poll, POLL_MS);
  }

  // Builds a circular avatar pin as an inline SVG data URL.
  // Falls back to a plain colored dot if no photo is available.
  function buildIcon(photoUrl, color) {
    const size = 50;
    if (photoUrl) {
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}">
          <defs>
            <clipPath id="clip"><circle cx="25" cy="25" r="20"/></clipPath>
          </defs>
          <circle cx="25" cy="25" r="23" fill="white"/>
          <circle cx="25" cy="25" r="21" fill="${color}"/>
          <image href="${photoUrl}" x="5" y="5" width="40" height="40"
                 clip-path="url(#clip)" preserveAspectRatio="xMidYMid slice"/>
        </svg>`;
      return {
        url: "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg),
        scaledSize: new google.maps.Size(size, size),
        anchor: new google.maps.Point(size / 2, size / 2)
      };
    }
    return {
      path: google.maps.SymbolPath.CIRCLE,
      scale: 9,
      fillColor: color,
      fillOpacity: 1,
      strokeColor: "#0e1419",
      strokeWeight: 2
    };
  }

  function colorFor(name, index) {
    return COLORS[index % COLORS.length];
  }

  function poll() {
    fetch(`${WEB_APP_URL}?secret=${encodeURIComponent(SECRET)}&mode=latest`)
      .then(res => res.json())
      .then(latest => {
        const names = Object.keys(latest);
        if (names.length === 0) return;

        const bounds = new google.maps.LatLngBounds();
        const legend = document.getElementById("legend");
        legend.innerHTML = "";

        names.forEach((name, i) => {
          const person = latest[name];
          const pos = { lat: Number(person.lat), lng: Number(person.lng) };
          const color = colorFor(name, i);
          const icon = buildIcon(person.image, color);

          if (!markers[name]) {
            markers[name] = new google.maps.Marker({ map, icon, position: pos });
            markers[name].addListener("click", () => showInfo(name, person, markers[name]));
          } else {
            markers[name].setIcon(icon);
            markers[name].setPosition(pos);
          }

          bounds.extend(pos);

          // Legend row
          const row = document.createElement("div");
          row.className = "legend-row";
          if (person.image) {
            row.innerHTML = `<img class="avatar" src="${person.image}"><span>${name}</span>`;
          } else {
            row.innerHTML = `<span class="swatch" style="background:${color}"></span><span>${name}</span>`;
          }
          legend.appendChild(row);
        });

        // Distance + line only make sense with exactly 2+ people — use first two
        if (names.length >= 2) {
          const a = latest[names[0]];
          const b = latest[names[1]];
          line.setPath([
            { lat: Number(a.lat), lng: Number(a.lng) },
            { lat: Number(b.lat), lng: Number(b.lng) }
          ]);

          const dist = haversineKm(a.lat, a.lng, b.lat, b.lng);
          document.getElementById("distanceVal").textContent =
            dist < 1 ? `${Math.round(dist * 1000)} m` : `${dist.toFixed(2)} km`;
        }

        map.fitBounds(bounds, 80);
        if (names.length === 1) map.setZoom(14);
      })
      .catch(err => console.error("Poll failed:", err));
  }

  function showInfo(name, person, marker) {
    const timeStr = person.time ? new Date(person.time).toLocaleString() : "";
    const photoHtml = person.image
      ? `<img src="${person.image}">`
      : "";
    infoWindow.setContent(`
      <div class="info-card">
        ${photoHtml}
        <div>
          <div class="name">${name}</div>
          <div class="time">${timeStr}</div>
        </div>
      </div>
    `);
    infoWindow.open(map, marker);
  }

  function haversineKm(lat1, lng1, lat2, lng2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a =
      Math.sin(dLat / 2) ** 2 +
      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
      Math.sin(dLng / 2) ** 2;
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
  }

  const darkMapStyle = [
    { elementType: "geometry", stylers: [{ color: "#1a222b" }] },
    { elementType: "labels.text.stroke", stylers: [{ color: "#1a222b" }] },
    { elementType: "labels.text.fill", stylers: [{ color: "#8a99a6" }] },
    { featureType: "road", elementType: "geometry", stylers: [{ color: "#2a3540" }] },
    { featureType: "water", elementType: "geometry", stylers: [{ color: "#0e1419" }] },
    { featureType: "poi", stylers: [{ visibility: "off" }] }
  ];
</script>

<!-- Replace YOUR_GOOGLE_MAPS_API_KEY with a real Maps JavaScript API key -->
<script async
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAtjFhtAivbZkleUUb8Jd2PAZqzVO7WDoA&callback=initMap">
</script>

</body>
</html>
