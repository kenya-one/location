<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Share Location</title>
<style>
  :root {
    --bg: #10151b;
    --panel: #182129;
    --line: #2a3540;
    --text: #e8edf2;
    --muted: #8a99a6;
    --accent: #3ba3ff;
    --good: #35c78a;
    --bad: #ff5d5d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 28px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
  }
  p.sub {
    color: var(--muted);
    margin: 0 0 24px;
    font-size: 14px;
    line-height: 1.5;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: #0e1419;
    color: var(--text);
    font-size: 15px;
    margin-bottom: 18px;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
  }
  .photo-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 18px;
  }
  .photo-preview {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: #0e1419;
    border: 1px solid var(--line);
    object-fit: cover;
    flex: none;
  }
  .photo-preview.placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 11px;
    text-align: center;
  }
  #photoBtn {
    flex: 1;
    margin-bottom: 0;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text);
  }
  input[type="file"] { display: none; }
  button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.05s ease, opacity 0.2s ease;
    margin-bottom: 10px;
  }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #locateBtn {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text);
  }
  #submitBtn {
    background: var(--accent);
    color: #06131f;
  }
  #submitBtn.update {
    background: var(--good);
  }
  .preview {
    background: #0e1419;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 18px;
    display: none;
  }
  .preview.show { display: block; }
  .preview strong { color: var(--text); }
  .status {
    margin-top: 4px;
    font-size: 13px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 18px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted);
    flex: none;
  }
  .dot.good { background: var(--good); }
  .dot.err { background: var(--bad); }
</style>
</head>
<body>

<div class="card">
  <h1>Share your location</h1>
  <p class="sub">
    This sends a single snapshot of your location and photo — it does not
    track you continuously. Come back anytime and submit again to update
    either one.
  </p>

  <label for="name">Your name</label>
  <input type="text" id="name" placeholder="e.g. Asha" autocomplete="off">

  <label>Your photo (optional)</label>
  <div class="photo-row">
    <img id="photoPreview" class="photo-preview placeholder" alt="">
    <button id="photoBtn" type="button">Choose Photo</button>
    <input type="file" id="photoInput" accept="image/*" capture="user">
  </div>

  <div class="preview" id="preview"></div>

  <button id="locateBtn">Get My Location</button>
  <button id="submitBtn" disabled>Share Location</button>

  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="statusText"></span>
  </div>
</div>

<script>
  // ---- CONFIGURE THESE TWO VALUES ----
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwHLc5b6ha6Fx1R5iWwhvwhl3QrKbOtwgINCG721uwBjzyl_8PQ0bhZcPuQ-q7NDcw_/exec";
  const SECRET = "my-team-2026"; // must match Code.gs
  // -------------------------------------

  const MAX_DIMENSION = 500; // resize photos before upload to keep payload small
  const JPEG_QUALITY = 0.8;

  const nameInput = document.getElementById("name");
  const locateBtn = document.getElementById("locateBtn");
  const submitBtn = document.getElementById("submitBtn");
  const preview = document.getElementById("preview");
  const dot = document.getElementById("dot");
  const statusText = document.getElementById("statusText");
  const photoBtn = document.getElementById("photoBtn");
  const photoInput = document.getElementById("photoInput");
  const photoPreviewImg = document.getElementById("photoPreview");

  let currentPos = null;
  let photoDataUrl = null; // resized/compressed base64 data URL, or null
  let hasSharedBefore = false;

  // Remember name across visits
  nameInput.value = localStorage.getItem("tracker_name") || "";
  hasSharedBefore = localStorage.getItem("tracker_has_shared") === "true";
  updateSubmitLabel();

  locateBtn.addEventListener("click", getLocation);
  submitBtn.addEventListener("click", submitLocation);
  photoBtn.addEventListener("click", () => photoInput.click());
  photoInput.addEventListener("change", handlePhotoSelect);

  function handlePhotoSelect(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function (evt) {
      const img = new Image();
      img.onload = function () {
        photoDataUrl = resizeImage(img);
        photoPreviewImg.src = photoDataUrl;
        photoPreviewImg.classList.remove("placeholder");
        photoBtn.textContent = "Change Photo";
      };
      img.src = evt.target.result;
    };
    reader.readAsDataURL(file);
  }

  function resizeImage(img) {
    let { width, height } = img;
    if (width > height && width > MAX_DIMENSION) {
      height = Math.round((height * MAX_DIMENSION) / width);
      width = MAX_DIMENSION;
    } else if (height > MAX_DIMENSION) {
      width = Math.round((width * MAX_DIMENSION) / height);
      height = MAX_DIMENSION;
    }

    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0, width, height);
    return canvas.toDataURL("image/jpeg", JPEG_QUALITY);
  }

  function getLocation() {
    if (!navigator.geolocation) {
      setStatus("err", "Geolocation not supported on this device");
      return;
    }

    locateBtn.disabled = true;
    setStatus("", "Finding your location…");

    navigator.geolocation.getCurrentPosition(
      pos => {
        currentPos = pos;
        locateBtn.disabled = false;
        submitBtn.disabled = false;
        setStatus("good", "Location found");
        preview.classList.add("show");
        preview.innerHTML =
          `<strong>Lat:</strong> ${pos.coords.latitude.toFixed(5)}<br>` +
          `<strong>Lng:</strong> ${pos.coords.longitude.toFixed(5)}<br>` +
          `Accuracy: ~${Math.round(pos.coords.accuracy)} m`;
      },
      err => {
        locateBtn.disabled = false;
        setStatus("err", "Location error: " + err.message);
      },
      { enableHighAccuracy: true, timeout: 15000 }
    );
  }

  function submitLocation() {
    const name = nameInput.value.trim();
    if (!name) {
      alert("Please enter your name first.");
      return;
    }
    if (!currentPos) {
      alert("Get your location first.");
      return;
    }

    localStorage.setItem("tracker_name", name);
    submitBtn.disabled = true;
    setStatus("", "Sending…");

    const payload = {
      secret: SECRET,
      name: name,
      lat: currentPos.coords.latitude,
      lng: currentPos.coords.longitude,
      time: new Date().toISOString()
    };
    if (photoDataUrl) {
      payload.image = photoDataUrl; // only include if a new photo was chosen
    }

    fetch(WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    })
      .then(res => res.json())
      .then(res => {
        submitBtn.disabled = false;
        if (res.error) {
          setStatus("err", res.error);
          return;
        }
        hasSharedBefore = true;
        localStorage.setItem("tracker_has_shared", "true");
        updateSubmitLabel();
        setStatus("good", `Shared at ${new Date().toLocaleTimeString()}`);
      })
      .catch(() => {
        submitBtn.disabled = false;
        setStatus("err", "Failed to send — try again");
      });
  }

  function updateSubmitLabel() {
    submitBtn.textContent = hasSharedBefore ? "Update Location" : "Share Location";
    submitBtn.classList.toggle("update", hasSharedBefore);
  }

  function setStatus(state, text) {
    dot.className = "dot" + (state ? " " + state : "");
    statusText.textContent = text;
  }
</script>

</body>
</html>
